[project]
name = "dataproof-runner"
version = "0.1.0"
description = "DataProof run supervisor: workers, stage execution and disposable environments"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "dataproof-contracts",
    "dataproof-control",
    "dataproof-scenario-commerce",
    "dataproof-verifier",
    "docker>=7.1",
    "psycopg>=3.2",
]

[tool.uv.sources]
dataproof-contracts = { workspace = true }
dataproof-control = { workspace = true }
dataproof-scenario-commerce = { workspace = true }
dataproof-verifier = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
