[project]
name = "dataproof-api"
version = "0.1.0"
description = "DataProof control plane API: GitHub webhook intake and, later, the reviewer API"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "dataproof-contracts",
    "dataproof-control",
    "dataproof-runner",
    "fastapi>=0.115",
    "psycopg>=3.2",
]

[tool.uv.sources]
dataproof-contracts = { workspace = true }
dataproof-control = { workspace = true }
dataproof-runner = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"
