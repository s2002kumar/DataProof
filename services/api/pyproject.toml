[project]
name = "dataproof-api"
version = "0.1.0"
description = "DataProof control plane: GitHub connector, reviewer API, preview gateway and process composition"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "dataproof-contracts",
    "dataproof-control",
    "dataproof-report",
    "dataproof-runner",
    "cryptography>=44",  # RS256 signing of GitHub App JWTs
    "docker>=7.1",  # the local execution backend, for the worker and gateway
    "fastapi>=0.115",
    "httpx2>=2.16",  # GitHub REST client
    "psycopg>=3.2",
    "uvicorn>=0.35",  # serves the API and the gateway
]

[tool.uv.sources]
dataproof-contracts = { workspace = true }
dataproof-control = { workspace = true }
dataproof-report = { workspace = true }
dataproof-runner = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"
