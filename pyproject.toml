[project]
name = "dataproof-workspace"
version = "0.0.0"
description = "DataProof monorepo workspace root (not a distributable package)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "alembic>=1.16",
    "dataproof-api",
    "dataproof-contracts",
    "dataproof-control",
    "dataproof-investigator",
    "dataproof-runner",
    "dataproof-scenario-commerce",
    "dataproof-verifier",
    "anthropic>=2.3,<3",  # adapter tests, with a mocked transport only
    "fastapi>=0.115",  # tests of the sample app's API
    "httpx2>=2.16",  # transport for the Starlette TestClient
    "jsonschema>=4.23",
    "mypy>=1.13",
    "playwright>=1.50",  # the browser end-to-end test (tests/e2e)
    "pre-commit>=4.0",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "ruff>=0.8",
    "sqlalchemy>=2.0",
    "testcontainers[postgres]>=4.9",
    "types-docker",
    "types-jsonschema",
    "tzdata",  # IANA zones for zoneinfo on Windows
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "scenarios/*", "services/*"]
# The sample app is the application under review: its own project and lockfile, never
# DataProof's (ADR-0004 builds its runtime image from that lockfile).
# The dashboard is a Next.js app in the pnpm workspace, not a Python package.
exclude = ["sample-app", "services/dashboard"]

[tool.uv.sources]
dataproof-api = { workspace = true }
dataproof-contracts = { workspace = true }
dataproof-control = { workspace = true }
dataproof-investigator = { workspace = true }
dataproof-runner = { workspace = true }
dataproof-scenario-commerce = { workspace = true }
dataproof-verifier = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "PT", "RUF",
    "DTZ",  # naive datetimes are never allowed
    "S",    # security lints
]

[tool.ruff.lint.isort]
known-first-party = [
    "commerce_env",
    "commerce_scenario",
    "conftest",
    "control_env",
    "docker_env",
    "github_env",
    "sample_app_env",
    "dataproof_api",
    "dataproof_contracts",
    "dataproof_control",
    "dataproof_investigator",
    "dataproof_runner",
    "dataproof_verifier",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # asserts
    "S106",  # test tokens are not secrets
    "S310",  # requests to loopback preview URLs
    "S603", "S607",  # git and docker subprocesses
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = [
    "packages/contracts/src",
    "packages/control/src",
    "packages/investigator/src",
    "packages/verifier/src",
    "services/api/src",
    "services/runner/src",
    "scenarios/commerce/src",
    "scenarios/commerce/changes",
    "sample-app/app",
    "sample-app/migrations",
    "tests",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "integration: needs a real PostgreSQL (DATAPROOF_TEST_DATABASE_URL or Docker for testcontainers)",
    "docker: needs a Docker daemon (local execution backend and the runtime image)",
    "e2e: drives the dashboard in a browser (DATAPROOF_E2E=1; needs pnpm and Chromium)",
]
