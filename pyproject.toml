[project]
name = "dataproof-workspace"
version = "0.0.0"
description = "DataProof monorepo workspace root (not a distributable package)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "dataproof-contracts",
    "jsonschema>=4.23",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.9",
    "types-jsonschema",
    "tzdata",  # IANA zones for zoneinfo on Windows
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
dataproof-contracts = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "PT", "RUF",
    "DTZ",  # naive datetimes are never allowed
    "S",    # security lints
]

[tool.ruff.lint.isort]
known-first-party = ["conftest", "dataproof_contracts"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["packages/contracts/src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "integration: needs a real PostgreSQL (DATAPROOF_TEST_DATABASE_URL or Docker for testcontainers)",
]
