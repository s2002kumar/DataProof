version: 2
updates:
  # Workflow actions are pinned to commit SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    groups:
      python:
        patterns: ["*"]

  # The sample app is the application under review and has its own lockfile (ADR-0004).
  - package-ecosystem: uv
    directory: /sample-app
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(sample-app)
    groups:
      sample-app:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    groups:
      node:
        patterns: ["*"]
