version: 2
updates:
  # Workflow actions are pinned to commit SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    groups:
      python:
        patterns: ["*"]

  # The sample app is the application under review and has its own lockfile (ADR-0004).
  - package-ecosystem: uv
    directory: /sample-app
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(sample-app)
    groups:
      sample-app:
        patterns: ["*"]

  # Base images of the trusted runtime image are pinned by digest.
  - package-ecosystem: docker
    directory: /infra/docker/runtime
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(runtime)
    groups:
      runtime-images:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    ignore:
      # @types/node follows the Node.js major that CI and the runtime use (24); a major bump
      # comes with a deliberate runtime upgrade.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      node:
        patterns: ["*"]
