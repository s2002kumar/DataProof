version: 2
updates:
  # Workflow actions are pinned to commit SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    groups:
      python:
        patterns: ["*"]

  # The sample app is the application under review and has its own lockfile (ADR-0004).
  - package-ecosystem: uv
    directory: /sample-app
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(sample-app)
    groups:
      sample-app:
        patterns: ["*"]

  # The sample frontend's lockfile; its dependencies are baked into the runtime image.
  - package-ecosystem: npm
    directory: /sample-app/web
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(sample-app)
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Next.js type-checks through the TypeScript compiler API, which the native TypeScript 7
      # does not provide; the frontend stays on TypeScript 5 until Next.js supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      sample-web:
        patterns: ["*"]

  # Base images of the trusted runtime image are pinned by digest.
  - package-ecosystem: docker
    directory: /infra/docker/runtime
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(runtime)
    ignore:
      # The runtime's Python and Node.js versions are deliberate (Python 3.12 for the sample app
      # and the workspace, Node.js 24 for the frontend). Dependabot keeps their digests and
      # patch releases current; a minor or major runtime upgrade is a reviewed change.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      runtime-images:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    ignore:
      # @types/node follows the Node.js major that CI and the runtime use (24); a major bump
      # comes with a deliberate runtime upgrade.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The dashboard is a Next.js app, which type-checks through the TypeScript compiler API
      # that the native TypeScript 7 does not provide; it stays on TypeScript 5 until Next.js
      # supports 7 (the contracts package is already on 7).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      node:
        patterns: ["*"]
