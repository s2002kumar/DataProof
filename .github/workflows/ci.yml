name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv sync --frozen
      - name: Run hooks (format, lint, mypy --strict, schema drift, file hygiene)
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks # the secret-scan job scans the full history instead

  python-tests:
    name: python-tests
    runs-on: ubuntu-24.04
    # Docker pipeline tests with previews, and the benchmark (both tiers' smoke runs).
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway CI database, never reachable from outside
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATAPROOF_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      DATAPROOF_FORBID_SKIPS: "1" # a skipped test fails the job (tests/conftest.py)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv sync --frozen
      - name: Unit and PostgreSQL integration tests
        # The browser test and the Action's suite each run in their own job, never skipped.
        run: uv run --frozen pytest --ignore=tests/integration/test_action.py --ignore=tests/e2e

  action-tests:
    name: action-tests
    runs-on: ubuntu-24.04
    # The GitHub Action end to end on the subscriptions example, and its adversarial security
    # tests (ADR-0007): a migration image is built, PostgreSQL containers are provisioned on the
    # local Docker backend, and hostile migrations are run. Its own job, with its own budget.
    timeout-minutes: 30
    env:
      DATAPROOF_FORBID_SKIPS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv sync --frozen
      - name: The Action and its security gate
        run: uv run --frozen pytest tests/integration/test_action.py

  typescript:
    name: typescript
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: JSON Schema conformance (Ajv strict) and dashboard tests
        run: pnpm run test
      - name: Dashboard production build
        run: pnpm --filter @dataproof/dashboard build

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway CI database, never reachable from outside
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATAPROOF_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      DATAPROOF_E2E: "1"
      DATAPROOF_FORBID_SKIPS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - name: Install Chromium
        run: uv run --frozen playwright install --with-deps chromium
      - name: A reviewer signs in and approves a binding in a browser
        run: uv run --frozen pytest tests/e2e

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
