# The DataProof Action on this repository's own pull requests: the subscriptions example under
# examples/subscriptions, configured by .github/dataproof/config.toml. Every pull request gets a
# real run; one that changes the example's migrations gets a real verdict on them.
name: dataproof

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dataproof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: dataproof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: DataProof
        id: dataproof
        uses: ./
        with:
          config: .github/dataproof/config.toml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: dataproof-report
          path: dataproof-report
