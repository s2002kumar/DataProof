[project]
name = "dataproof-action"
version = "0.1.0"
description = "DataProof GitHub Action: database-tier verification of a PostgreSQL/Alembic pull request"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "dataproof-contracts",
    "dataproof-investigator",
    "dataproof-report",
    "dataproof-runner",
    "dataproof-verifier",
    "docker>=7.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
]

[tool.uv.sources]
dataproof-contracts = { workspace = true }
dataproof-investigator = { workspace = true }
dataproof-report = { workspace = true }
dataproof-runner = { workspace = true }
dataproof-verifier = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"
