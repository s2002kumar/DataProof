[project]
name = "dataproof-report"
version = "0.1.0"
description = "Renders a run's report as Markdown for GitHub: check summaries and job summaries"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "dataproof-contracts",
]

[tool.uv.sources]
dataproof-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"
