[project]
name = "dataproof-control"
version = "0.1.0"
description = "DataProof control-plane store: run lifecycle, transition log and durable job queue on PostgreSQL"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "dataproof-contracts",
    "psycopg>=3.2",
]

[tool.uv.sources]
dataproof-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"
