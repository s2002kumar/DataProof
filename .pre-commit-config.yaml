# Install once with `uv run pre-commit install`. CI runs the same hooks on every pull request
# (skipping gitleaks there, because the secret-scan job scans the full history instead).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy --strict
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: contract-schemas
        name: contract JSON Schemas are current
        entry: uv run --frozen python -m dataproof_contracts.schema packages/contracts/schemas --check
        language: system
        files: ^packages/contracts/
        pass_filenames: false
