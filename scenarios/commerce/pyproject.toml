[project]
name = "dataproof-scenario-commerce"
version = "0.1.0"
description = "Deterministic Commerce Orders & Refunds baseline fixture for DataProof"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["psycopg>=3.2"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "commerce_scenario"
