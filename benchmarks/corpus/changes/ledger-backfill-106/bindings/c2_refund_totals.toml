# Proposed by the pull request; untrusted until a digest-bound APPROVE_BINDING.
contract_id = "commerce.c2_refund_totals"
query_sql = """
SELECT o.order_id, o.currency::text AS currency,
       COALESCE(SUM(l.amount) FILTER (WHERE l.entry_kind = 'REFUND'), 0)::numeric(18, 2)
         AS refund_total
FROM orders AS o
LEFT JOIN ledger_entries AS l ON l.order_id = o.order_id
GROUP BY o.order_id, o.currency
"""

[column_mapping]
order_id = "order_id"
currency = "currency"
refund_total = "refund_total"
