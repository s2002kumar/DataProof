[project]
name = "dataproof-benchmark"
version = "0.1.0"
description = "DataProof's fault benchmark: a seeded corpus, fair baselines and a reproducible report"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "dataproof-contracts",
    "dataproof-runner",
    "dataproof-scenario-commerce",
    "dataproof-verifier",
    "psycopg>=3.2",
    "sqlalchemy>=2.0",
]

[tool.uv.sources]
dataproof-contracts = { workspace = true }
dataproof-runner = { workspace = true }
dataproof-scenario-commerce = { workspace = true }
dataproof-verifier = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"
